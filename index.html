  <style>
    :root{color-scheme:dark;--bg:#090d16;--surface:#111a2b;--line:#263858;--text:#eef5ff;--muted:#aabbd4;--accent:#64d2ff;--violet:#8b7bff}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 15% -10%,#1e3c75 0,transparent 30rem),radial-gradient(circle at 90% 15%,#382769 0,transparent 27rem),var(--bg);color:var(--text);font:16px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}a{color:inherit}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid var(--line);backdrop-filter:blur(14px);background:#090d16c7;position:sticky;top:0;z-index:2}.nav{min-height:70px;display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{font-weight:800;text-decoration:none;letter-spacing:.02em}.brand i{display:inline-block;width:11px;height:11px;margin-right:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent)}.navlinks{display:flex;flex-wrap:wrap;gap:7px}.navlinks a{text-decoration:none;color:var(--muted);border:1px solid transparent;border-radius:999px;padding:7px 11px;font-size:.9rem}.navlinks a:hover,.navlinks .active{color:var(--text);border-color:var(--line);background:#16233a}main{padding:70px 0 90px}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:.76rem;font-weight:800;letter-spacing:.16em}h1{max-width:760px;margin:12px 0 16px;font-size:clamp(2.5rem,7vw,5.5rem);line-height:.98;letter-spacing:-.065em}.intro{max-width:650px;color:var(--muted);font-size:1.1rem}.stats{display:flex;flex-wrap:wrap;gap:11px;margin:34px 0 54px}.stat{border:1px solid var(--line);background:#0d1525b8;border-radius:13px;padding:12px 16px;color:var(--muted)}.stat strong{display:block;color:var(--text);font-size:1.25rem}h2{margin:0 0 18px;font-size:1.35rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#15243dcb,#0d1422e6);text-decoration:none;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 18px 45px #0007}.tag{align-self:flex-start;padding:4px 9px;border-radius:999px;background:#1d4968;color:#cdf1ff;font-size:.73rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.card h3{margin:35px 0 7px;font-size:1.25rem;line-height:1.15}.card p{margin:0;color:var(--muted);font-size:.94rem}.arrow{margin-top:20px;color:var(--accent);font-weight:700}.featured{grid-column:span 2;background:linear-gradient(125deg,#163766,#34245f)}footer{color:var(--muted);border-top:1px solid var(--line);padding:28px 0 42px;font-size:.9rem}@media(max-width:760px){.nav{padding:12px 0;align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.featured{grid-column:auto}main{padding-top:45px}}
    /* Gemeinsame Kopfzeile für alle Datenflix007-Bereiche. */
    header{background:rgba(9,13,22,.84);border-bottom-color:#263858}.brand i{background:#62e0c0;box-shadow:0 0 10px #62e0c0,0 0 24px rgba(98,224,192,.55)}.navlinks a:hover,.navlinks .active{color:var(--text);border-color:#3b557d;background:#16233a}
    /* Die Projektkarten übernehmen bewusst die etablierte Optik der Projektübersicht. */
    .catalog{margin-top:54px}.catalog h2{font-size:clamp(1.7rem,3vw,2.3rem);margin-bottom:7px}.catalog-intro{margin:0 0 23px;color:var(--muted)}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.catalog-grid .card.project{min-height:0;padding:18px;background:#111418;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.4);color:#e6e9ef;transition:transform .2s ease,box-shadow .2s ease}.catalog-grid .card.project:hover{transform:translateY(-2px);border-color:#46658f;box-shadow:0 14px 30px rgba(0,0,0,.28)}.catalog-grid .project h3{margin:0 0 6px;font-size:1.05rem}.catalog-grid .muted{color:#8892a6}.catalog-grid .project a{color:#4fc3f7!important;font-weight:600}.catalog-grid .tag{display:inline-block;border:1px solid #334155;border-radius:999px;padding:4px 8px;font-size:.8rem;color:#8892a6;margin:8px 8px 0 0}.catalog-status{color:var(--muted);padding:24px 0}.catalog-error{color:#ffd2d2}@media(max-width:900px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.catalog-grid{grid-template-columns:1fr}}
    /* Gemeinsame Portalgrundlage; Akzente bleiben auf Karten beschränkt. */
    body{background:#0b0d10;color:#e6e9ef}.wrap{width:min(1100px,calc(100% - 40px))}.card,.stat{border-color:#334155;background:#111418}.card{box-shadow:0 10px 30px rgba(2,6,23,.4)}footer{border-top-color:#263858;color:#8892a6}
  </style>
    <link rel="stylesheet" href="https://datenflix007.github.io/shared/site-shell.css?v=20261005-i18n">

<body>
  <header><div class="wrap nav"><a class="brand" href="https://datenflix007.github.io/"><i></i>Felix Staacke</a><nav class="navlinks" aria-label="Bereiche"><a href="https://datenflix007.github.io/">Portal</a><a href="https://datenflix007.github.io/guides/">Guides</a><a href="https://datenflix007.github.io/digital-worksheets/">Arbeitsblätter</a></nav></div></header>
  <main class="wrap">
  <section class="catalog" aria-labelledby="catalog-title"><h2 id="catalog-title">Alle Tools</h2><p class="catalog-intro" id="catalog-description">Lade die vollständige Werkzeugsammlung …</p><div class="catalog-grid" id="projectCatalog" aria-live="polite"><p class="catalog-status">Karten werden geladen …</p></div></section></main><footer><div class="wrap">Datenflix007 · Werkzeuge für neugieriges Lernen</div></footer>
  <script>
    (async () => {
      const category = "Tools";
      const catalog = document.getElementById("projectCatalog");
      const description = document.getElementById("catalog-description");
      const localSource = new URL("../datenflix007.github.io/src/projekte.html", location.href).href;
      const productionSource = "https://datenflix007.github.io/src/projekte.html";
      const sources = location.hostname === "datenflix007.github.io" ? [productionSource] : [localSource, productionSource];
      const removedWorksheetTitles = new Set([
        "Der Jenaer Wald und wir",
        "Klima-Labor: Nachhaltige Stadtentwicklung",
      ]);

      const createMindmapCard = () => {
        const card = document.createElement("article");
        card.className = "card project";
        card.innerHTML = `
          <h3>Mindmap</h3>
          <div role="img" aria-label="Vorschau einer vernetzten Mindmap" style="width:100%; aspect-ratio:16/9; display:grid; place-items:center; margin:12px 0; border-radius:12px; overflow:hidden; background:radial-gradient(circle at 50% 50%, rgba(98,224,192,.22), transparent 34%), linear-gradient(135deg, #0b2530, #15213d); border:1px solid #62e0c0;">
            <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
              <g stroke="#62e0c0" stroke-width="3" opacity=".82"><path d="M160 90 76 42M160 90 66 132M160 90 254 42M160 90 264 132" /></g>
              <g fill="#0b2530" stroke="#62e0c0" stroke-width="3"><circle cx="160" cy="90" r="29" fill="#62e0c0" /><circle cx="76" cy="42" r="18" /><circle cx="66" cy="132" r="18" /><circle cx="254" cy="42" r="18" /><circle cx="264" cy="132" r="18" /></g>
              <text x="160" y="96" text-anchor="middle" fill="#0b2530" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Ideen</text>
            </svg>
          </div>
          <p class="muted">Kollaboratives Arbeitsmodul</p>
          <p class="muted">Gemeinsam Ideen sammeln: Gruppen arbeiten an Mindmaps, die Referentenansicht bündelt und exportiert die Ergebnisse.<br><br /><a style="color:#4FC3F7; font-weight:600;" href="https://datenflix007.github.io/mindmap/" target="_blank" rel="noopener">Online nutzen</a></p>
          <div><span class="tag">Mindmap</span><span class="tag">Kollaboration</span><span class="tag">Bildung</span></div>`;
        return card;
      };
      try {
        let sourceText;
        let sourceUrl;
        for (const candidate of sources) {
          try {
            const response = await fetch(candidate);
            if (!response.ok) continue;
            sourceText = await response.text();
            sourceUrl = candidate;
            break;
          } catch (_) { /* try the next source */ }
        }
        if (!sourceText) throw new Error("Katalogquelle nicht erreichbar");
        const documentFromSource = new DOMParser().parseFromString(sourceText, "text/html");
        const sourceDetails = [...documentFromSource.querySelectorAll("details")].find((element) => element.querySelector("summary")?.textContent.trim() === category);
        const cards = sourceDetails
          ? [...sourceDetails.querySelectorAll(".grid > .card.project")].filter(
              (card) => !removedWorksheetTitles.has(card.querySelector("h3")?.textContent.trim()),
            )
          : [];
        if (!cards.length) throw new Error("Keine Tool-Karten gefunden");
        const fragment = document.createDocumentFragment();
        fragment.append(createMindmapCard());
        cards.forEach((sourceCard) => {
          const card = sourceCard.cloneNode(true);
          card.querySelectorAll("img[src], a[href]").forEach((element) => {
            const attribute = element.hasAttribute("src") ? "src" : "href";
            const value = element.getAttribute(attribute);
            if (value && !/^(#|mailto:|tel:|https?:)/i.test(value)) element.setAttribute(attribute, new URL(value, sourceUrl).href);
          });
          fragment.append(card);
        });
        catalog.replaceChildren(fragment);
        description.textContent = `${cards.length} Tools, Labs und Projekte – direkt aus der zentralen Projektübersicht.`;
      } catch (error) {
        catalog.innerHTML = '<p class="catalog-status catalog-error">Die Tool-Sammlung konnte gerade nicht geladen werden. Bitte Seite neu laden.</p>';
        description.textContent = "Die vollständige Werkzeugsammlung wird aus dem zentralen Portal geladen.";
      }
    })();
  </script>
  <script src="https://datenflix007.github.io/feedback-widget.js?repo=tools" defer></script></main>
</body></html>
